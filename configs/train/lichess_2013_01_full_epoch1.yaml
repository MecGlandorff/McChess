# First uncapped full-month supervised run.
#
# This uses the full January 2013 train/validation shards for one epoch. It is
# a data-path and throughput run, not a strength experiment. It requires a
# CUDA-enabled PyTorch install; CPU fallback would be too slow for this config.
# Keep num_workers at 0 until the dataset is tensor-cached or streamed; on
# Windows, worker processes can duplicate the full in-memory JSONL sample list.

train_path: data/processed/lichess_2013_01_full/train.jsonl
val_path: data/processed/lichess_2013_01_full/val.jsonl
dataset_manifest_path: data/manifests/lichess_2013_01_full_manifest.json
output_dir: runs/lichess_2013_01_full_epoch1

seed: 20260601
device: cuda
batch_size: 1024
epochs: 1
learning_rate: 0.0005
weight_decay: 0.001
value_weight: 1.0
num_workers: 0
log_every_steps: 250

model:
  channels: 32
  num_blocks: 1
  value_hidden_dim: 64
