[project]
name = "mcchess"
version = "0.1.0"
description = "A compact neural chess research system trained without engine labels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "python-chess",
    "torch",
    "PyYAML",
    "tqdm",
]

[tool.poetry]
packages = [{ include = "mcchess", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
ruff = "^0.15"
mypy = "^1.19"

[tool.poetry.group.notebook.dependencies]
ipykernel = "^7.0"
nbclassic = "^1.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = false
